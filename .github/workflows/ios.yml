name: iOS

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Core tests
        run: swift test --package-path WaveCatchCore

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Generate the Xcode project
        working-directory: WaveCatchApp
        run: xcodegen generate

      - name: Choose a simulator
        id: sim
        run: |
          python3 - <<'PY'
          import json, re, subprocess

          def sh(*args):
              return subprocess.check_output(args, text=True)

          def version_of(text):
              match = re.search(r"iOS[- ](\d+)(?:[.-](\d+))?", text)
              if not match:
                  return (0, 0)
              return (int(match.group(1)), int(match.group(2) or 0))

          devices = json.loads(sh("xcrun", "simctl", "list", "devices", "available", "-j"))
          types = json.loads(sh("xcrun", "simctl", "list", "devicetypes", "-j")).get("devicetypes", [])
          runtimes = [
              runtime for runtime in json.loads(sh("xcrun", "simctl", "list", "runtimes", "available", "-j")).get("runtimes", [])
              if runtime.get("isAvailable", True) and "iOS" in runtime.get("name", "") + runtime.get("identifier", "")
          ]
          runtimes.sort(key=lambda runtime: version_of(runtime.get("identifier", "") + runtime.get("name", "")))

          wanted = ["iPhone 15 Pro Max", "iPhone 16 Pro Max"]
          existing = {name: [] for name in wanted}
          for runtime, group in devices.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in group:
                  if not device.get("isAvailable", True):
                      continue
                  name = device.get("name", "")
                  if name in existing:
                      existing[name].append((version_of(runtime), name, device["udid"]))

          chosen = None
          for name in wanted:
              if existing[name]:
                  existing[name].sort()
                  _, name, udid = existing[name][-1]
                  chosen = (name, udid)
                  break

          def supports(runtime, type_id):
              supported = runtime.get("supportedDeviceTypes")
              if not supported:
                  return True
              ids = []
              for item in supported:
                  if isinstance(item, str):
                      ids.append(item)
                  elif isinstance(item, dict):
                      ids.append(item.get("identifier", ""))
              return type_id in ids

          if chosen is None:
              type_by_name = {item.get("name"): item.get("identifier") for item in types}
              for name in wanted:
                  type_id = type_by_name.get(name)
                  if not type_id:
                      continue
                  for runtime in reversed(runtimes):
                      if not supports(runtime, type_id):
                          continue
                      try:
                          udid = sh(
                              "xcrun", "simctl", "create",
                              name, type_id, runtime["identifier"],
                          ).strip()
                      except subprocess.CalledProcessError as error:
                          print(f"create {name} failed: {error}")
                          continue
                      if udid:
                          chosen = (name, udid)
                          break
                  if chosen:
                      break

          if chosen is None:
              fallback = []
              for runtime, group in devices.get("devices", {}).items():
                  if "iOS" not in runtime:
                      continue
                  for device in group:
                      if device.get("isAvailable", True) and device.get("name") == "iPhone 17 Pro Max":
                          fallback.append((version_of(runtime), device["name"], device["udid"]))
              if not fallback:
                  raise SystemExit("no iPhone 15 Pro Max, 16 Pro Max, or 17 Pro Max")
              fallback.sort()
              _, name, udid = fallback[-1]
              print("iPhone 15/16 Pro Max device types are not installed; using iPhone 17 Pro Max")
              chosen = (name, udid)

          name, udid = chosen
          print(f"name={name}")
          print(f"udid={udid}")
          with open("/tmp/sim-choice.txt", "w") as path:
              path.write(f"{name}\n{udid}\n")
          PY
          NAME=$(sed -n '1p' /tmp/sim-choice.txt)
          UDID=$(sed -n '2p' /tmp/sim-choice.txt)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using $NAME ($UDID)"

      - name: Build for testing
        working-directory: WaveCatchApp
        run: |
          xcodebuild build-for-testing \
            -project WaveCatch.xcodeproj \
            -scheme WaveCatch \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath /tmp/WaveCatchDD \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Boot simulator, record, and play a full game
        working-directory: WaveCatchApp
        run: |
          set +e
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
          xcrun simctl status_bar "${{ steps.sim.outputs.udid }}" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4
          BAR=$?
          if [ "$BAR" -ne 0 ]; then
            echo "status bar override failed"
            exit "$BAR"
          fi
          mkdir -p /tmp/wavecatch-proof "$GITHUB_WORKSPACE/docs/proof"
          rm -f /tmp/wavecatch-proof/record-start /tmp/wavecatch-proof/record-stop /tmp/wavecatch-proof/record-cancel /tmp/wavecatch-proof/record.pid /tmp/wavecatch-proof/raw.mp4 /tmp/wavecatch-proof/audio.log
          rm -f "$GITHUB_WORKSPACE/docs/proof/gameplay.mp4"
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log stream --style compact --predicate 'eventMessage CONTAINS "WCAUDIO" OR composedMessage CONTAINS "WCAUDIO"' > /tmp/wavecatch-proof/audio.log 2>&1 &
          LOG_PID=$!
          (
            deadline=$((SECONDS + 180))
            while [ ! -f /tmp/wavecatch-proof/record-start ] && [ ! -f /tmp/wavecatch-proof/record-cancel ]; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "recorder: timed out waiting for the menu"
                exit 0
              fi
              sleep 0.2
            done
            if [ ! -f /tmp/wavecatch-proof/record-start ]; then
              echo "recorder: cancelled before the menu"
              exit 0
            fi
            echo "recorder: menu is up"
            python3 -c 'import time; open("/tmp/wavecatch-proof/record-start.time","w").write(f"{time.time():.6f}\n")'
            xcrun simctl io "${{ steps.sim.outputs.udid }}" recordVideo --codec h264 --force /tmp/wavecatch-proof/raw.mp4 &
            echo $! > /tmp/wavecatch-proof/record.pid
            while [ ! -f /tmp/wavecatch-proof/record-stop ] && [ ! -f /tmp/wavecatch-proof/record-cancel ]; do
              sleep 0.2
            done
            sleep 0.4
            if [ -f /tmp/wavecatch-proof/record.pid ]; then
              kill -INT "$(cat /tmp/wavecatch-proof/record.pid)" || true
              wait "$(cat /tmp/wavecatch-proof/record.pid)" || true
            fi
            echo "recorder: stopped"
          ) &
          WATCH_PID=$!
          xcodebuild test-without-building \
            -project WaveCatch.xcodeproj \
            -scheme WaveCatch \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath /tmp/WaveCatchDD \
            -only-testing:WaveCatchUITests/WaveCatchUITests/testFullGameProof \
            -parallel-testing-enabled NO \
            -resultBundlePath /tmp/wavecatch-proof/Test.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee /tmp/wavecatch-proof/xcodebuild.log
          STATUS=${PIPESTATUS[0]}
          touch /tmp/wavecatch-proof/record-cancel
          wait "$WATCH_PID" || true
          if [ -n "${LOG_PID:-}" ]; then
            kill -INT "$LOG_PID" || true
            wait "$LOG_PID" || true
          fi
          sleep 1
          echo "audio log lines: $(wc -l < /tmp/wavecatch-proof/audio.log 2>/dev/null || echo 0)"
          TRIM=""
          if [ -f /tmp/wavecatch-proof/restart.time ] && [ -f /tmp/wavecatch-proof/record-start.time ]; then
            TRIM=$(python3 -c 'start=float(open("/tmp/wavecatch-proof/record-start.time").read()); restart=float(open("/tmp/wavecatch-proof/restart.time").read()); print(f"{max(1.0, restart-start+3.0):.3f}")')
            echo "trim gameplay to ${TRIM}s (3s after restart)"
          fi
          if [ -n "$TRIM" ]; then
            bash "$GITHUB_WORKSPACE/Scripts/compress-proof.sh" /tmp/wavecatch-proof/raw.mp4 /tmp/wavecatch-proof/silent.mp4 "$TRIM"
          else
            bash "$GITHUB_WORKSPACE/Scripts/compress-proof.sh" /tmp/wavecatch-proof/raw.mp4 /tmp/wavecatch-proof/silent.mp4
          fi
          COMPRESS=$?
          if [ "$COMPRESS" -eq 0 ]; then
            if [ ! -s /tmp/wavecatch-proof/audio.log ]; then
              echo "audio log is empty"
              COMPRESS=1
            else
              python3 -m venv /tmp/wavecatch-venv
              /tmp/wavecatch-venv/bin/pip install numpy
              /tmp/wavecatch-venv/bin/python3 "$GITHUB_WORKSPACE/Scripts/mux-proof-audio.py" \
                /tmp/wavecatch-proof/silent.mp4 \
                /tmp/wavecatch-proof/audio.log \
                /tmp/wavecatch-proof/record-start.time \
                "$GITHUB_WORKSPACE/docs/proof/gameplay.mp4"
              COMPRESS=$?
            fi
          fi
          if [ "$COMPRESS" -eq 0 ]; then
            ffprobe -hide_banner -show_streams "$GITHUB_WORKSPACE/docs/proof/gameplay.mp4"
            CODEC=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$GITHUB_WORKSPACE/docs/proof/gameplay.mp4" || true)
            echo "audio codec: ${CODEC:-none}"
            if [ "$CODEC" != "aac" ]; then
              echo "gameplay.mp4 is missing an AAC audio stream"
              COMPRESS=1
            else
              ffmpeg -i "$GITHUB_WORKSPACE/docs/proof/gameplay.mp4" -af volumedetect -f null - || true
            fi
          fi
          if [ "$COMPRESS" -ne 0 ]; then
            rm -f "$GITHUB_WORKSPACE/docs/proof/gameplay.mp4"
          fi
          rm -f "$GITHUB_WORKSPACE"/docs/proof/*.png
          cp -f /tmp/wavecatch-proof/*.png "$GITHUB_WORKSPACE/docs/proof/" || true
          for shot in "$GITHUB_WORKSPACE"/docs/proof/*.png; do
            W=$(sips -g pixelWidth "$shot" | awk '/pixelWidth/{print $2}')
            H=$(sips -g pixelHeight "$shot" | awk '/pixelHeight/{print $2}')
            if [ -n "$W" ] && [ -n "$H" ] && [ "$H" -gt "$W" ]; then
              sips -r 270 "$shot" >/dev/null
            elif [ -n "$W" ] && [ -n "$H" ]; then
              sips -r 180 "$shot" >/dev/null
            fi
            W=$(sips -g pixelWidth "$shot" | awk '/pixelWidth/{print $2}')
            H=$(sips -g pixelHeight "$shot" | awk '/pixelHeight/{print $2}')
            echo "$(basename "$shot") ${W}x${H}"
            if [ "$W" != "2796" ] || [ "$H" != "1290" ]; then
              echo "$(basename "$shot") is ${W}x${H}, expected 2796x1290"
              if [ "$STATUS" -eq 0 ]; then
                STATUS=1
              fi
            fi
          done
          ls -lh "$GITHUB_WORKSPACE/docs/proof" || true
          for name in 01-menu 02-pool 03-catch 04-golden 05-gameover 06-restart 07-swell-ring; do
            if [ ! -f "$GITHUB_WORKSPACE/docs/proof/${name}.png" ]; then
              echo "missing ${name}.png"
              if [ "$STATUS" -eq 0 ]; then
                STATUS=1
              fi
            fi
          done
          if [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi
          exit "$COMPRESS"

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof
          path: docs/proof/
          if-no-files-found: warn

      - name: Upload raw recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-recording
          path: /tmp/wavecatch-proof/raw.mp4
          if-no-files-found: warn

  appetize:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: WaveCatchApp
        run: xcodegen generate

      - name: Build an unsigned simulator app
        working-directory: WaveCatchApp
        run: |
          set -euo pipefail
          build_sim() {
            local archs="$1"
            rm -rf /tmp/WaveCatchSimDD
            xcodebuild build \
              -project WaveCatch.xcodeproj \
              -scheme WaveCatch \
              -configuration Release \
              -sdk iphonesimulator \
              -destination "generic/platform=iOS Simulator" \
              -derivedDataPath /tmp/WaveCatchSimDD \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM="" \
              ONLY_ACTIVE_ARCH=NO \
              EXCLUDED_ARCHS="" \
              ARCHS="$archs"
          }
          set +e
          build_sim "x86_64 arm64"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "simulator archs: x86_64 arm64" | tee /tmp/appetize-archs.txt
          else
            echo "x86_64 slice did not build; shipping arm64 only"
            build_sim "arm64"
            echo "simulator archs: arm64" | tee /tmp/appetize-archs.txt
          fi

      - name: Zip WaveCatch.app for Appetize
        run: |
          set -euo pipefail
          APP=$(find /tmp/WaveCatchSimDD/Build/Products -type d -name 'WaveCatch.app' -path '*iphonesimulator*' | head -1)
          test -n "$APP"
          test -d "$APP"
          echo "app: $APP"
          lipo -info "$APP/WaveCatch"
          rm -f /tmp/WaveCatch-sim.zip
          ditto -c -k --sequesterRsrc --keepParent "$APP" /tmp/WaveCatch-sim.zip
          unzip -l /tmp/WaveCatch-sim.zip
          # The archive root is the bundle, not a parent folder.
          unzip -Z1 /tmp/WaveCatch-sim.zip | awk 'NR==1 { if ($0 !~ /^WaveCatch\.app\//) exit 1 }'
          ls -lh /tmp/WaveCatch-sim.zip
          cat /tmp/appetize-archs.txt

      - name: Upload appetize simulator app
        uses: actions/upload-artifact@v4
        with:
          name: appetize-sim-app
          path: /tmp/WaveCatch-sim.zip
          if-no-files-found: error
